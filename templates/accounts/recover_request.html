<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recover — Mtaani</title><style>body{font-family:system-ui,sans-serif;max-width:420px;margin:16px auto;padding:0 12px}input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}button{padding:10px 16px}ul.errorlist{color:#b00}</style></head>
<body>
<h1>Recover your account</h1>
{% if messages %}<ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}
<button type="submit">Send reset code</button></form>
</body></html>
