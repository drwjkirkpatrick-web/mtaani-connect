# Production compose — app + PostGIS + Redis + Caddy (Prompt 42).
# Bring up: docker compose -f deploy/docker-compose.prod.yml up -d
# (compose config sanity is tested in tests/test_deploy.py WITHOUT docker;
# this host's docker daemon is broken by design of the dev box.)

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtaani
      POSTGRES_USER: mtaani
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtaani -d mtaani"]
      interval: 10s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Throttle state restart-loss is acceptable (Prompt 36); no persistence.
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "0"
      DATABASE_URL: postgres://mtaani:${DB_PASSWORD}@db:5432/mtaani
      REDIS_URL: redis://redis:6379/3
      SESSION_COOKIE_SECURE: "1"
      SECURE_SSL_REDIRECT: "1"
      SECURE_HSTS_SECONDS: "31536000"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
    volumes:
      - media:/app/mediafiles
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddydata:
  caddyconfig:
